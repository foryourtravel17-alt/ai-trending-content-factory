name: Bullseye Automation Failure Watchdog

on:
  workflow_run:
    workflows:
      - "AI Trading Content Pipeline"
      - "Generate Approved Reel"
      - "Publish Approved Reel to Instagram"
      - "Telegram Approval"
      - "Instagram Token Health Check"
      - "Autonomous Market Content Factory"
      - "Market Signal Approval Poller"
      - "Bullseye Weekly P&L and Engagement Summary"
      - "Market Factory Schedule Watchdog"
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  alert-on-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Alert Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_STATUS: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          CURRENT_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?per_page=20&branch=main"
          previous=$(curl -sS --fail -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$api" | jq -r --argjson current "$CURRENT_RUN_ID" '.workflow_runs[] | select(.id != $current) | .conclusion' | head -n 1)
          if [ "$previous" = "failure" ]; then
            echo "Previous run of ${WORKFLOW_NAME} also failed; suppressing duplicate Telegram alert."
            exit 0
          fi
          message="$(printf '⚠️ Bullseye Theory automation alert\n\nWorkflow: %s\nStatus: %s\n\nOpen run: %s' "$WORKFLOW_NAME" "$WORKFLOW_STATUS" "$RUN_URL")"
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}"
