name: Bullseye Automation Failure Watchdog

on:
  workflow_run:
    workflows:
      - "AI Trading Content Pipeline"
      - "Generate Approved Reel"
      - "Publish Approved Reel to Instagram"
      - "Telegram Approval"
    types: [completed]

permissions:
  contents: read

jobs:
  alert-on-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Alert Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_STATUS: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          message="⚠️ Bullseye Theory automation alert%0A%0AWorkflow: ${WORKFLOW_NAME}%0AStatus: ${WORKFLOW_STATUS}%0A%0AOpen run: ${RUN_URL}"
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}"
