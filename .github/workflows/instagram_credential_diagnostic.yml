name: Diagnose Instagram Credential Link (Read Only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/instagram_credential_diagnostic.yml'
      - 'scripts/diagnose_instagram_credential.py'
      - 'tests/test_instagram_credential_diagnostic.py'
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Read-only credential and Page-link check
        run: python scripts/diagnose_instagram_credential.py
