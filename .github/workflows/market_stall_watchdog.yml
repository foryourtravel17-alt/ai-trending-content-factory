name: Market Factory Schedule Watchdog

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/market_stall_watchdog.yml
      - scripts/market_stall_check.py
  schedule:
    - cron: "0 13 * * 1-5" # 18:30 IST, after the last scheduled market-content slot
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check-recent-success:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout stall check script
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/market_stall_check.py
          sparse-checkout-cone-mode: false
      - name: Check recent market workflow success
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/market_stall_check.py
