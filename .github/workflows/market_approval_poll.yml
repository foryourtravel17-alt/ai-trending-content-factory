name: Market Signal Approval Poller

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-state
  cancel-in-progress: false

jobs:
  poll-and-publish-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Poll Telegram approval buttons
        id: approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          POLL_SECONDS: "10"
        run: python src/telegram_process.py

      - name: Publish the approved market scenario
        if: steps.approval.outputs.market_approved == 'true'
        env:
          PUBLISH_ONLY: "true"
          PUBLISH_ONLY_SIGNAL_ID: ${{ steps.approval.outputs.market_signal_id }}
          HUMAN_APPROVAL: "false"
          DRY_RUN: "0"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
          GH_USER: ${{ vars.GH_USER || secrets.GH_USER }}
          GH_REPO: ${{ vars.GH_REPO || secrets.GH_REPO }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m src.orchestrator

      - name: Commit approval and publish state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/telegram_state.json output/approval_queue.json data/state.json output/content_*.json
          if git diff --cached --quiet; then
            echo "No approval-state changes to commit."
          else
            git commit -m "market: record Telegram approval decision"
            git pull --rebase origin main
            git push
          fi
