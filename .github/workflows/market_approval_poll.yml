name: Market Signal Approval Poller

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/market_approval_poll.yml
      - .github/workflows/deployment_readiness.yml
      - .github/workflows/telegram_approval.yml
      - src/telegram_process.py
      - src/telegram_send.py
      - scripts/queue_educational_draft.py
      - scripts/export_public_market_feed.py
      - scripts/preflight_publish_guard.py
      - tests/test_single_telegram_poller.py
      - tests/test_educational_approval_publisher.py
      - tests/test_publish_state_staging.py
      - tests/test_deployment_readiness.py
      - scripts/publish_approved_educational_reels.py
      - scripts/stage_publish_state.sh
      - scripts/check_deployment_readiness.py
      - scripts/alert_expired_educational_drafts.py
      - tests/test_expired_educational_draft_alert.py
      - src/instagram_publish.py
      - scripts/upload_educational_reel.py
      - tests/test_instagram_publish.py
      - tests/test_upload_educational_reel.py
      - tests/test_agents_publisher_approval.py
      - tests/test_instagram_publisher.py
  workflow_run:
    workflows: ["Autonomous Market Content Factory"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-state
  cancel-in-progress: false

jobs:
  poll-and-publish-approved:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Poll Telegram approval buttons
        id: approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_APPROVER_USER_IDS: ${{ secrets.TELEGRAM_APPROVER_USER_IDS }}
          # Scheduled checks stay short; a push/manual run or completed draft run
          # keeps the listener available for the owner to review and approve.
          POLL_SECONDS: ${{ github.event_name == 'schedule' && '15' || '240' }}
        run: python src/telegram_process.py

      - name: Install publisher dependencies only when publishing is required
        if: steps.approval.outputs.market_approved_ids != '' || steps.approval.outputs.educational_approved_ids != ''
        run: python -m pip install -r requirements.txt

      - name: Guard and publish approved market scenarios
        if: steps.approval.outputs.market_approved_ids != ''
        env:
          APPROVED_SIGNAL_IDS: ${{ steps.approval.outputs.market_approved_ids }}
          PUBLISH_ONLY: "true"
          HUMAN_APPROVAL: "true"
          DRY_RUN: "0"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
          GH_USER: ${{ vars.GH_USER || secrets.GH_USER }}
          GH_REPO: ${{ vars.GH_REPO || secrets.GH_REPO }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
        run: |
          set +e
          IFS=',' read -r -a signal_ids <<< "$APPROVED_SIGNAL_IDS"
          failed=0
          for signal_id in "${signal_ids[@]}"; do
            echo "Preflight approved signal: $signal_id"
            if ! python scripts/preflight_publish_guard.py "$signal_id"; then
              echo "SKIP: guard blocked $signal_id"
              continue
            fi
            echo "Publishing approved signal: $signal_id"
            PUBLISH_ONLY_SIGNAL_ID="$signal_id" python -m src.orchestrator || failed=1
          done
          exit "$failed"

      - name: Install FFmpeg for approved educational Reel verification
        if: steps.approval.outputs.educational_approved_ids != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Publish approved educational Reels
        if: steps.approval.outputs.educational_approved_ids != ''
        env:
          EDUCATIONAL_APPROVED_IDS: ${{ steps.approval.outputs.educational_approved_ids }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/publish_approved_educational_reels.py

      - name: Alert once for recently expired educational drafts
        if: always() && steps.approval.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/alert_expired_educational_drafts.py

      - name: Export sanitized approved Market Lab feed
        if: always() && steps.approval.outcome == 'success'
        run: python scripts/export_public_market_feed.py

      - name: Commit approval and publish state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/stage_publish_state.sh
          if git diff --cached --quiet; then
            echo "No approval-state changes to commit."
          else
            git commit -m "market: record Telegram approval and publishing state"
            git pull --rebase origin main
            git push
          fi
