name: Market Signal Approval Poller

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/market_approval_poll.yml
      - src/telegram_process.py
      - scripts/export_public_market_feed.py
      - scripts/preflight_publish_guard.py
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-state
  cancel-in-progress: false

jobs:
  poll-and-publish-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Poll Telegram approval buttons
        id: approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          POLL_SECONDS: "15"
        run: python src/telegram_process.py

      - name: Install market dependencies only when publishing is required
        if: steps.approval.outputs.market_approved_ids != ''
        run: python -m pip install -r requirements.txt

      - name: Guard and publish approved market scenarios
        if: steps.approval.outputs.market_approved_ids != ''
        env:
          APPROVED_SIGNAL_IDS: ${{ steps.approval.outputs.market_approved_ids }}
          PUBLISH_ONLY: "true"
          HUMAN_APPROVAL: "false"
          DRY_RUN: "0"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN || secrets.IG_ACCESS_TOKEN || secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
          GH_USER: ${{ vars.GH_USER || secrets.GH_USER }}
          GH_REPO: ${{ vars.GH_REPO || secrets.GH_REPO }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
        run: |
          set +e
          IFS=',' read -r -a signal_ids <<< "$APPROVED_SIGNAL_IDS"
          failed=0
          for signal_id in "${signal_ids[@]}"; do
            echo "Preflight approved signal: $signal_id"
            if ! python scripts/preflight_publish_guard.py "$signal_id"; then
              echo "SKIP: guard blocked $signal_id"
              continue
            fi
            echo "Publishing approved signal: $signal_id"
            PUBLISH_ONLY_SIGNAL_ID="$signal_id" python -m src.orchestrator || failed=1
          done
          exit "$failed"

      - name: Export sanitized approved Market Lab feed
        if: always() && steps.approval.outcome == 'success'
        run: python scripts/export_public_market_feed.py

      - name: Commit approval and publish state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/telegram_state.json output/approval_queue.json data/state.json data/approved_market_feed.json
          find output -maxdepth 1 -type f -name "content_*.json" -print0 | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "No approval-state changes to commit."
          else
            git commit -m "market: record Telegram approval decision"
            git pull --rebase origin main
            git push
          fi
