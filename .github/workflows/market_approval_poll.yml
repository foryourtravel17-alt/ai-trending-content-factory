name: Market Signal Approval Poller

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/market_approval_poll.yml
      - .github/workflows/deployment_readiness.yml
      - .github/workflows/telegram_approval.yml
      - src/telegram_process.py
      - src/telegram_reel_publish.py
      - src/telegram_send.py
      - scripts/queue_educational_draft.py
      - scripts/export_public_market_feed.py
      - scripts/preflight_publish_guard.py
      - tests/test_single_telegram_poller.py
      - tests/test_telegram_callback_retry.py
      - tests/test_educational_approval_publisher.py
      - tests/test_publisher.py
      - tests/test_agents_publisher_approval.py
      - tests/test_workflow_safety.py
      - tests/test_publish_state_staging.py
      - tests/test_deployment_readiness.py
      - scripts/publish_approved_educational_reels.py
      - scripts/stage_publish_state.sh
      - scripts/check_deployment_readiness.py
      - scripts/alert_expired_educational_drafts.py
      - tests/test_expired_educational_draft_alert.py
      - scripts/upload_educational_reel.py
      - tests/test_upload_educational_reel.py
      - tests/test_agents_publisher_approval.py
      - tests/test_workflow_safety.py
      - tests/test_daily_reel_draft.py
  workflow_run:
    workflows: ["Autonomous Market Content Factory"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-state
  cancel-in-progress: false

jobs:
  poll-and-publish-approved:
    # Always poll callbacks, even when the upstream draft workflow fails.
    # A Telegram delivery timeout must not disable the independent approval listener.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Inspect Telegram bot identity and webhook state (read-only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              print("Telegram diagnostic skipped: bot token is not configured.")
              raise SystemExit(0)

          def call(method):
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=b"",
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if not payload.get("ok") or not isinstance(payload.get("result"), dict):
                  raise RuntimeError("Telegram returned an unsuccessful metadata response")
              return payload["result"]

          try:
              bot = call("getMe")
              webhook = call("getWebhookInfo")
          except Exception as exc:
              # Keep this diagnostic non-blocking; never print URLs, response bodies, or tokens.
              print("Telegram metadata diagnostic unavailable: " + type(exc).__name__)
              raise SystemExit(0)

          print("Configured Telegram bot username: @" + str(bot.get("username") or "unknown"))
          webhook_url = str(webhook.get("url") or "")
          print("Webhook configured: " + ("yes" if webhook_url else "no"))
          print("Pending Telegram updates reported by Bot API: " + str(webhook.get("pending_update_count", 0)))
          print("Webhook last error recorded: " + ("yes" if webhook.get("last_error_date") else "no"))
          if webhook_url:
              print("WARNING: webhook is configured; getUpdates polling cannot receive updates while it remains active.")
          PY

      - name: Poll Telegram approval buttons
        id: approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_APPROVER_USER_IDS: ${{ secrets.TELEGRAM_APPROVER_USER_IDS }}
          # Scheduled checks stay short; a push/manual run or completed draft run
          # keeps the listener available for the owner to review and approve.
          POLL_SECONDS: ${{ github.event_name == 'schedule' && '60' || '240' }}
        run: python src/telegram_process.py

      - name: Install publisher dependencies only when publishing is required
        if: steps.approval.outputs.market_approved_ids != '' || steps.approval.outputs.educational_approved_ids != ''
        run: python -m pip install -r requirements.txt

      - name: Guard and publish approved market scenarios
        if: steps.approval.outputs.market_approved_ids != ''
        env:
          APPROVED_SIGNAL_IDS: ${{ steps.approval.outputs.market_approved_ids }}
          PUBLISH_ONLY: "true"
          HUMAN_APPROVAL: "true"
          DRY_RUN: "0"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          IFS=',' read -r -a signal_ids <<< "$APPROVED_SIGNAL_IDS"
          failed=0
          for signal_id in "${signal_ids[@]}"; do
            echo "Preflight approved signal: $signal_id"
            if ! python scripts/preflight_publish_guard.py "$signal_id"; then
              echo "SKIP: guard blocked $signal_id"
              continue
            fi
            echo "Publishing approved signal: $signal_id"
            PUBLISH_ONLY_SIGNAL_ID="$signal_id" python -m src.orchestrator || failed=1
          done
          exit "$failed"

      - name: Install FFmpeg for approved educational Reel verification
        if: steps.approval.outputs.educational_approved_ids != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Publish approved educational Reels
        if: steps.approval.outputs.educational_approved_ids != ''
        env:
          EDUCATIONAL_APPROVED_IDS: ${{ steps.approval.outputs.educational_approved_ids }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/publish_approved_educational_reels.py

      - name: Alert once for recently expired educational drafts
        if: always() && steps.approval.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/alert_expired_educational_drafts.py

      - name: Export sanitized approved Market Lab feed
        if: always() && steps.approval.outcome == 'success'
        run: python scripts/export_public_market_feed.py

      - name: Commit approval and publish state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/stage_publish_state.sh
          if git diff --cached --quiet; then
            echo "No approval-state changes to commit."
          else
            git commit -m "market: record Telegram approval and publishing state"
            git pull --rebase --autostash origin main
            git push
          fi
