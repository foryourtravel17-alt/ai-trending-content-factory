name: Publish Approved Reel to Instagram

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate Approved Reel"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    # Publish after a successful Reel generation, or when manually dispatched.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check generated candidate manifest
        id: candidate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          if os.getenv("GITHUB_EVENT_NAME") == "workflow_dispatch":
              has_candidate = True
          else:
              try:
                  manifest = json.loads(Path("output/latest_reel_generated.json").read_text(encoding="utf-8"))
                  has_candidate = bool(manifest.get("content_ids"))
              except (OSError, json.JSONDecodeError, AttributeError):
                  has_candidate = False
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"has_candidate={str(has_candidate).lower()}\n")
          print(f"Generation manifest contains candidate: {has_candidate}")
          PY

      - name: Publish approved Reel
        if: steps.candidate.outputs.has_candidate == 'true'
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python src/instagram_publish.py

      - name: Save Instagram publish state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/content_*.json output/media/*.publish.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: save Instagram publish state"
          git push
