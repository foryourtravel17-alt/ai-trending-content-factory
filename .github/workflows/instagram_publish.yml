name: Publish Approved Reel to Instagram

on:
  workflow_run:
    workflows: ["Generate Approved Reel"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    # Safety switch: publishing stays OFF until you create the
    # repository variable AUTO_PUBLISH_ENABLED=true.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      vars.AUTO_PUBLISH_ENABLED == 'true'

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish approved Reel
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python src/instagram_publish.py

      - name: Save Instagram publish state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/content_*.json output/media/*.publish.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: save Instagram publish state"
          git push
