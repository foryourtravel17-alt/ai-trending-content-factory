name: Publish Approved Reel to Instagram

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate Approved Reel"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Publish approved Reel
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
        run: python src/instagram_publish.py

      - name: Commit Instagram status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/content_*.json
          if git diff --cached --quiet; then
            echo "No Instagram status changes."
          else
            git commit -m "chore: record Instagram publish"
            git push
          fi
