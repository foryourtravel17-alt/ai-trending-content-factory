name: Controlled Single Telegram Signal Retry

on:
  workflow_dispatch:
    inputs:
      signal_id:
        description: "Exact previously approved market signal ID to retry"
        required: true
        type: string
      confirm:
        description: "Type RETRY to authorize one controlled Telegram attempt"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: market-state
  cancel-in-progress: false

jobs:
  retry-one:
    if: ${{ inputs.confirm == 'RETRY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Preflight owner approval, freshness and Telegram duplicate state
        env:
          SIGNAL_ID: ${{ inputs.signal_id }}
        run: |
          python - <<'PY'
          import json, os, sys
          from src.orchestrator import _signal_is_fresh
          sid = os.environ["SIGNAL_ID"].strip()
          if not sid or any(c not in "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_" for c in sid):
              print("BLOCKED: invalid signal ID")
              sys.exit(1)
          with open("data/state.json", encoding="utf-8") as handle:
              state = json.load(handle)
          rec = state.get("signals", {}).get(sid)
          if not rec:
              print("BLOCKED: signal not found")
              sys.exit(1)
          if rec.get("approval_status") != "approved":
              print("BLOCKED: signal lacks explicit human Telegram approval")
              sys.exit(1)
          if not _signal_is_fresh(rec.get("signal", {})):
              print("BLOCKED: signal is stale; generate a fresh market observation")
              sys.exit(1)
          telegram = (rec.get("publishing") or {}).get("telegram") or {}
          status = telegram.get("status")
          if status == "published":
              print("BLOCKED: Telegram already published this signal")
              sys.exit(1)
          if status in {"sending", "unknown"}:
              print("BLOCKED: Telegram delivery outcome is ambiguous; manual reconciliation required")
              sys.exit(1)
          print(f"Preflight passed for owner-approved Telegram signal {sid}; prior status={status}")
          PY

      - name: Send exact approved signal to Telegram
        env:
          PUBLISH_ONLY: "true"
          PUBLISH_ONLY_SIGNAL_ID: ${{ inputs.signal_id }}
          HUMAN_APPROVAL: "true"
          DRY_RUN: "0"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.orchestrator

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/approved_market_feed.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "market: record controlled single-signal Telegram retry"
            git pull --rebase --autostash origin main
            git push
          fi
