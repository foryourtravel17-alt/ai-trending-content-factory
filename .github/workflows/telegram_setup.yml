name: Telegram Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-chat:
    runs-on: ubuntu-latest

    steps:
      - name: Detect Telegram Chat ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN")

          if not token:
              print("ERROR: TELEGRAM_BOT_TOKEN secret is missing.")
              sys.exit(1)

          url = f"https://api.telegram.org/bot{token}/getUpdates"

          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = json.load(response)
          except Exception as e:
              print("ERROR: Could not connect to Telegram.")
              print(str(e))
              sys.exit(1)

          if not data.get("ok"):
              print("ERROR: Telegram API returned an error.")
              print(data)
              sys.exit(1)

          updates = data.get("result", [])

          if not updates:
              print("NO CHAT FOUND.")
              print("Open your Bullseye Theory AI bot in Telegram and send /start.")
              sys.exit(0)

          found = set()

          for update in updates:
              message = update.get("message") or update.get("channel_post")

              if not message:
                  continue

              chat = message.get("chat", {})
              chat_id = chat.get("id")
              chat_type = chat.get("type")
              chat_title = chat.get("title")
              username = chat.get("username")
              first_name = chat.get("first_name")

              if chat_id is not None:
                  item = (
                      str(chat_id),
                      str(chat_type),
                      str(chat_title or ""),
                      str(username or ""),
                      str(first_name or "")
                  )

                  if item not in found:
                      found.add(item)

          if not found:
              print("Updates were received, but no chat message was found.")
              print("Send /start to the bot and run this workflow again.")
          else:
              print("")
              print("TELEGRAM CHAT FOUND")
              print("===================")

              for chat_id, chat_type, title, username, first_name in sorted(found):
                  print(f"Chat ID: {chat_id}")
                  print(f"Type: {chat_type}")

                  if title:
                      print(f"Title: {title}")

                  if username:
                      print(f"Username: @{username}")

                  if first_name:
                      print(f"Name: {first_name}")

                  print("-------------------")
          PY
