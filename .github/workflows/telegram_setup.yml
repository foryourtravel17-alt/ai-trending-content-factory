name: Telegram Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-chat:
    runs-on: ubuntu-latest

    steps:
      - name: Detect Telegram Chat ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN")

          if not token:
              print("ERROR: TELEGRAM_BOT_TOKEN secret is missing.")
              sys.exit(1)

          base = f"https://api.telegram.org/bot{token}"

          def call(method, params=None):
              params = params or {}
              data = urllib.parse.urlencode(params).encode()
              request = urllib.request.Request(
                  f"{base}/{method}",
                  data=data,
                  method="POST"
              )
              with urllib.request.urlopen(request, timeout=40) as response:
                  return json.load(response)

          me = call("getMe")

          if not me.get("ok"):
              print("ERROR: Telegram rejected the bot token.")
              sys.exit(1)

          print(f"Bot OK: @{me['result'].get('username', 'unknown')}")

          webhook = call("getWebhookInfo")

          if not webhook.get("ok"):
              print("ERROR: Could not check webhook.")
              sys.exit(1)

          webhook_url = webhook["result"].get("url", "")

          if webhook_url:
              print("Webhook found. Removing it...")
              result = call(
                  "deleteWebhook",
                  {"drop_pending_updates": "false"}
              )
              print(f"Webhook removal: {result}")
          else:
              print("No webhook is currently set.")

          print("")
          print("======================================")
          print("WAITING FOR TELEGRAM MESSAGE")
          print("======================================")
          print("Now open Bullseye Theory AI bot and send /start.")
          print("The workflow will listen for up to 60 seconds.")
          print("")

          deadline = time.time() + 60
          found = set()

          while time.time() < deadline:

              try:
                  updates = call(
                      "getUpdates",
                      {
                          "timeout": "10",
                          "limit": "100",
                          "allowed_updates": '["message"]'
                      }
                  )
              except Exception as e:
                  print(f"Temporary Telegram error: {e}")
                  time.sleep(2)
                  continue

              if not updates.get("ok"):
                  print("Telegram API error:")
                  print(updates)
                  time.sleep(2)
                  continue

              for update in updates.get("result", []):
                  message = update.get("message")

                  if not message:
                      continue

                  chat = message.get("chat", {})
                  chat_id = chat.get("id")

                  if chat_id is not None:
                      found.add((
                          str(chat_id),
                          str(chat.get("type", "")),
                          str(chat.get("title") or ""),
                          str(chat.get("username") or ""),
                          str(chat.get("first_name") or "")
                      ))

              if found:
                  break

              time.sleep(2)

          if not found:
              print("")
              print("NO CHAT FOUND.")
              print("The bot did not receive a message during the 60-second window.")
              sys.exit(0)

          print("")
          print("======================================")
          print("TELEGRAM CHAT FOUND")
          print("======================================")

          for chat_id, chat_type, title, username, first_name in sorted(found):
              print(f"Chat ID: {chat_id}")
              print(f"Type: {chat_type}")

              if title:
                  print(f"Title: {title}")

              if username:
                  print(f"Username: @{username}")

              if first_name:
                  print(f"Name: {first_name}")

              print("--------------------------------------")
          PY
