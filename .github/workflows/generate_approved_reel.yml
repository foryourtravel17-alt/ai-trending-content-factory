name: Generate Approved Reel

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Telegram Approval"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: approved-reel
  cancel-in-progress: false

jobs:
  generate-reel:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FFmpeg and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pillow

      - name: Generate approved Reel
        run: python src/reel_generator.py

      - name: Upload Reel to Supabase
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -e
          VIDEO_PATH="$(find output/media -maxdepth 1 -type f -name '*.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          if [ -z "$VIDEO_PATH" ]; then
            echo "No generated Reel found."
            exit 1
          fi
          CONTENT_ID="$(basename "$VIDEO_PATH" .mp4)"
          echo "Uploading $VIDEO_PATH to Supabase as reels/$CONTENT_ID.mp4"
          curl --fail-with-body --retry 3 --retry-delay 2             -X POST             "https://kjhdcpjztuzpysdauqdz.supabase.co/storage/v1/object/REELS/reels/$CONTENT_ID.mp4"             -H "Authorization: Bearer $SUPABASE_SECRET_KEY"             -H "apikey: $SUPABASE_SECRET_KEY"             -H "Content-Type: video/mp4"             -H "x-upsert: true"             --data-binary "@$VIDEO_PATH"
          echo "Supabase upload successful."
          echo "Public URL: https://kjhdcpjztuzpysdauqdz.supabase.co/storage/v1/object/public/REELS/reels/$CONTENT_ID.mp4"

      - name: Commit generated Reel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/media/
          if git diff --cached --quiet; then
            echo "No new Reel to commit."
          else
            git commit -m "chore: generate approved reel"
            git push
          fi
