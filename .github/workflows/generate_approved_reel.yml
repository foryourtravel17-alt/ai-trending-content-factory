name: Generate Approved Reel

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["AI Trading Content Pipeline", "AI Trading Content Pipeline "]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: approved-reel
  cancel-in-progress: false

jobs:
  generate-reel:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate approved Reel
        run: python src/reel_generator.py

      - name: Commit generated Reel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/media/
          if git diff --cached --quiet; then
            echo "No new Reel to commit."
          else
            git commit -m "chore: generate approved reel"
            git push
          fi
