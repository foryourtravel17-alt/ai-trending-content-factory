name: Generate Approved Reel

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["AI Trading Content Pipeline (Automatic Publish)"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: market-state
  cancel-in-progress: false

jobs:
  generate-reel:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install FFmpeg and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pillow
          python -m pip install --upgrade edge-tts

      - name: Check for newly approved content
        id: approval_check
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          found = False
          now = datetime.now(timezone.utc)
          for path in sorted(Path("output").glob("content_*.json")):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              try:
                  created = datetime.fromisoformat(str(data.get("created_at", "")).replace("Z", "+00:00"))
                  if created.tzinfo is None:
                      created = created.replace(tzinfo=timezone.utc)
                  age = now - created.astimezone(timezone.utc)
              except (TypeError, ValueError):
                  continue
              fact_status = str((data.get("fact_check") or {}).get("status", "")).strip().lower()
              approval = data.get("approval") if isinstance(data.get("approval"), dict) else {}
              safety_check = data.get("safety_check") if isinstance(data.get("safety_check"), dict) else {}
              content_id = data.get("content_id", path.stem)
              video = Path("output/media") / f"{content_id}.mp4"
              if (
                  data.get("status") == "approved_for_publishing"
                  and approval.get("status") == "approved"
                  and approval.get("mode") == "automated_policy"
                  and approval.get("required") is False
                  and bool(approval.get("automated_review_at"))
                  and safety_check.get("passed") is True
                  and fact_status in {"passed", "verified", "approved"}
                  and timedelta(0) <= age <= timedelta(hours=24)
                  and not data.get("reel_generated", False)
                  and not video.exists()
              ):
                  found = True
                  break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"has_approved={str(found).lower()}\n")
          print(f"Newly approved content found: {found}")
          PY

      - name: Generate approved Reel
        if: steps.approval_check.outputs.has_approved == 'true'
        run: python src/reel_generator.py

      - name: Upload Reel to Supabase
        if: steps.approval_check.outputs.has_approved == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          VIDEO_PATH="$(find output/media -maxdepth 1 -type f -name '*.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          if [ -z "$VIDEO_PATH" ]; then
            echo "No generated Reel found."
            exit 1
          fi
          CONTENT_ID="$(basename "$VIDEO_PATH" .mp4)"
          echo "Uploading $VIDEO_PATH to Supabase as reels/$CONTENT_ID.mp4"
          curl --fail-with-body --retry 3 --retry-delay 2 \
            -X POST \
            "${SUPABASE_URL}/storage/v1/object/REELS/reels/$CONTENT_ID.mp4" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: video/mp4" \
            -H "x-upsert: true" \
            --data-binary "@$VIDEO_PATH"
          echo "Supabase upload successful."

      - name: Commit generated Reel and state
        if: steps.approval_check.outputs.has_approved == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/media/ output/content_*.json
          if git diff --cached --quiet; then
            echo "No Reel/state changes to commit."
          else
            git commit -m "chore: generate approved reel and lock state"
            git push
          fi

      - name: No-op status
        if: steps.approval_check.outputs.has_approved != 'true'
        run: echo "No newly approved content. Nothing to generate."
