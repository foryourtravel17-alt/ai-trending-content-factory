name: Organic-to-Paid Readiness Review

on:
  schedule:
    - cron: "45 16 * * 5" # Friday 22:15 IST, after the weekly report
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organic-ads-readiness
  cancel-in-progress: false

jobs:
  read-only-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Review recent Instagram Insights and message the owner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
          LOOKBACK_DAYS: "14"
        run: python scripts/ad_readiness.py
