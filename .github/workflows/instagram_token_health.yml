name: Instagram Token Health Check

on:
  push:
    paths:
      - '.github/workflows/instagram_token_health.yml'
      - 'agents/publisher.py'
      - 'tests/test_workflow_safety.py'
  workflow_dispatch:
  schedule:
    # Avoid the top of the hour because GitHub documents higher Actions load.
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  token-health:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate Meta credential and linked Instagram account
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
        run: |
          set -euo pipefail
          linked=""
          page_token=""
          token_source=""
          for source in INSTAGRAM_ACCESS_TOKEN IG_ACCESS_TOKEN META_SYSTEM_USER_TOKEN; do
            candidate="${!source:-}"
            if [ -z "${candidate}" ]; then
              continue
            fi
            response="$(curl -sS --get "https://graph.facebook.com/${META_GRAPH_API_VERSION}/me/accounts" --data-urlencode "fields=id,name,tasks,access_token,instagram_business_account{id,username}" --data-urlencode "access_token=${candidate}")"
            if grep -q '"error"' <<<"${response}"; then
              echo "INFO: Meta Page lookup failed for credential source ${source}; trying next configured source."
              continue
            fi
            parsed="$(python -c 'import json,sys; d=json.load(sys.stdin); rows=[x for x in d.get("data",[]) if str(x.get("name","")).strip().casefold()=="bullseye theory" and (x.get("instagram_business_account") or {}).get("id") and x.get("access_token")]; print(str((rows[0].get("instagram_business_account") or {}).get("id",""))+"\t"+str(rows[0].get("access_token","")) if len(rows)==1 else "")' <<<"${response}")"
            if [ -n "${parsed}" ]; then
              IFS=$'\t' read -r linked page_token <<<"${parsed}"
              token_source="${source}"
              break
            fi
            echo "INFO: Credential source ${source} did not resolve exactly one linked Bullseye Theory Page; trying next configured source."
          done
          if [ -z "${linked}" ] || [ -z "${page_token}" ]; then
            echo "ERROR: No configured Meta credential could resolve exactly one Bullseye Theory Page with a linked Instagram account and Page access token. Credential values redacted."
            exit 1
          fi
          echo "INFO: Page link resolved using credential source ${token_source}; credential values redacted."
          configured="${IG_USER_ID:-${INSTAGRAM_USER_ID:-}}"
          if [ -z "${configured}" ]; then
            echo "INFO: Legacy Instagram account-ID secret is unset; publisher resolves the account from the linked Bullseye Theory Page."
          elif [ "${configured}" != "${linked}" ]; then
            echo "WARNING: Legacy Instagram account-ID secret is stale; publisher will use the account resolved from the exact Bullseye Theory Page. No secret values are printed."
          fi
          account_response="$(curl -sS --get "https://graph.facebook.com/${META_GRAPH_API_VERSION}/${linked}" --data-urlencode "fields=id,username" --data-urlencode "access_token=${page_token}")"
          if grep -q '"error"' <<<"${account_response}"; then
            echo "ERROR: The Page-linked Instagram account cannot be loaded with its Page access token. Meta response redacted."
            exit 1
          fi
          echo "PASS: the Instagram account linked to the Bullseye Theory Page is readable with its Page access token."

      - name: Alert Telegram on invalid token or broken Instagram link
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          message="⚠️ Bullseye Theory automation: Meta/Instagram access check failed. Open the failed Token Health Check run for the exact error."
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=@bullseye_theory" --data-urlencode "text=${message}"
