name: Instagram Token Health Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram_token_health.yml'
  workflow_dispatch:
  schedule:
    # Avoid the top of the hour because GitHub documents higher Actions load there.
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  token-health:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate Meta credential and linked Instagram account
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
        run: |
          set -euo pipefail
          token_source=""
          if [ -n "${INSTAGRAM_ACCESS_TOKEN}" ]; then
            token="${INSTAGRAM_ACCESS_TOKEN}"
            token_source="INSTAGRAM_ACCESS_TOKEN"
          elif [ -n "${IG_ACCESS_TOKEN}" ]; then
            token="${IG_ACCESS_TOKEN}"
            token_source="IG_ACCESS_TOKEN"
          elif [ -n "${META_SYSTEM_USER_TOKEN}" ]; then
            token="${META_SYSTEM_USER_TOKEN}"
            token_source="META_SYSTEM_USER_TOKEN"
          else
            token=""
          fi
          if [ -z "${token}" ]; then
            echo "ERROR: No Meta credential is configured."
            exit 1
          fi
          echo "Checking Meta credential source: ${token_source}; value redacted."
          response="$(curl -sS --get "https://graph.facebook.com/${META_GRAPH_API_VERSION}/me/accounts" --data-urlencode "fields=id,name,tasks,instagram_business_account{id,username}" --data-urlencode "access_token=${token}")"
          if echo "${response}" | grep -q '"error"'; then
            safe_error="$(python -c 'import json,sys; e=json.load(sys.stdin).get("error",{}); safe=lambda x: "".join(c for c in str(x if x is not None else "unknown") if c.isalnum() or c in "._-")[:64] or "unknown"; print("code={}, subcode={}, type={}".format(safe(e.get("code")), safe(e.get("error_subcode")), safe(e.get("type"))))' <<<"${response}")"
            echo "ERROR: Meta credential/account check failed for ${token_source} (${safe_error}); error message redacted."
            exit 1
          fi
          linked="$(python -c 'import json,sys; d=json.load(sys.stdin); rows=[x for x in d.get("data",[]) if (x.get("instagram_business_account") or {}).get("id")]; rows.sort(key=lambda x: 0 if str(x.get("name","")).strip().lower()=="bullseye theory" else 1); print((rows[0].get("instagram_business_account") or {}).get("id","") if rows else "")' <<<"${response}")"
          if [ -z "${linked}" ]; then
            echo "ERROR: System User has no assigned Page with a linked Instagram account."
            exit 1
          fi
          echo "Meta credential is valid; linked Instagram account found (ID redacted)."

      - name: Alert Telegram on invalid token or broken Instagram link
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          message="⚠️ Bullseye Theory automation: Meta/Instagram access check failed. Open the failed Token Health Check run for the exact error."
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=@bullseye_theory" --data-urlencode "text=${message}"
