name: Instagram Token Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  token-health:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate Meta access token
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
        run: |
          set -euo pipefail
          response="$(curl -sS --get "https://graph.facebook.com/${META_GRAPH_API_VERSION}/me"             --data-urlencode "fields=id,name"             --data-urlencode "access_token=${INSTAGRAM_ACCESS_TOKEN}")"
          echo "Meta token health response received."
          if echo "${response}" | grep -q '"error"'; then
            echo "${response}"
            exit 1
          fi
          echo "${response}" | grep -q '"id"'
          echo "Meta access token is valid."

          accounts="$(curl -sS --get "https://graph.facebook.com/${META_GRAPH_API_VERSION}/me/accounts" \
            --data-urlencode "fields=id,name,instagram_business_account{id,username}" \
            --data-urlencode "access_token=${INSTAGRAM_ACCESS_TOKEN}")"
          echo "Meta account-access response received."
          if echo "${accounts}" | grep -q '"error"'; then
            echo "${accounts}"
            exit 1
          fi
          if ! echo "${accounts}" | grep -q '"instagram_business_account"'; then
            echo "${accounts}"
            echo "No connected Instagram Business/Creator account was returned."
            exit 1
          fi
          echo "Connected Instagram account access is valid."

      - name: Alert Telegram on invalid token
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          message="⚠️ Bullseye Theory automation: Meta/Instagram access check failed. Instagram publishing needs attention. Open the failed Token Health Check run for the exact Meta error."
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             --data-urlencode "chat_id=@bullseye_theory"             --data-urlencode "text=${message}"
