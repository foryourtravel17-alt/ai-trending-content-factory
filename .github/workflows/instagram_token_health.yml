name: Instagram Token Health Check

on:
  push:
    paths:
      - '.github/workflows/instagram_token_health.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  token-health:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate Meta Page token and linked Instagram account
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
        run: |
          set -euo pipefail

          page_response="$(curl -sS --get "https://graph.facebook.com/${META_GRAPH_API_VERSION}/me"             --data-urlencode "fields=id,name,instagram_business_account{id,username}"             --data-urlencode "access_token=${INSTAGRAM_ACCESS_TOKEN}")"

          echo "Meta Page token identity response received."
          if echo "${page_response}" | grep -q '"error"'; then
            echo "${page_response}"
            exit 1
          fi

          echo "${page_response}" | grep -q '"id"'
          echo "${page_response}" | grep -q '"name"'

          linked_ig_id="$(python -c 'import json,sys; d=json.load(sys.stdin); print((d.get("instagram_business_account") or {}).get("id",""))' <<<"${page_response}")"

          if [ -n "${linked_ig_id}" ]; then
            echo "Linked Instagram account detected: ${linked_ig_id}"
          else
            echo "ERROR: Meta Page token is valid, but this Page has no instagram_business_account visible to the token."
            echo "The Facebook Page must be linked to the Bullseye Theory Professional Instagram account and the Meta app must be re-authorized."
            exit 1
          fi

          if [ -n "${INSTAGRAM_USER_ID:-}" ] && [ "${INSTAGRAM_USER_ID}" != "${linked_ig_id}" ]; then
            echo "NOTICE: INSTAGRAM_USER_ID differs from Meta's linked Instagram ID."
            echo "Configured ID: ${INSTAGRAM_USER_ID}"
            echo "Linked ID: ${linked_ig_id}"
          fi

          ig_response="$(curl -sS --get "https://graph.facebook.com/${META_GRAPH_API_VERSION}/${linked_ig_id}"             --data-urlencode "fields=id,username"             --data-urlencode "access_token=${INSTAGRAM_ACCESS_TOKEN}")"

          if echo "${ig_response}" | grep -q '"error"'; then
            echo "${ig_response}"
            exit 1
          fi

          echo "${ig_response}" | grep -q '"id"'
          echo "Instagram publishing token can access the linked Bullseye Theory account."

      - name: Alert Telegram on invalid token or broken Instagram link
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          message="⚠️ Bullseye Theory automation: Meta/Instagram access check failed. The Page token or Page↔Instagram link needs attention. Open the failed Token Health Check run for the exact error."
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             --data-urlencode "chat_id=@bullseye_theory"             --data-urlencode "text=${message}"
