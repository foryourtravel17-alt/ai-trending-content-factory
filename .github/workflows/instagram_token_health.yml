name: Instagram Token Health Check

on:
  push:
    paths:
      - '.github/workflows/instagram_token_health.yml'
      - 'agents/publisher.py'
  workflow_dispatch:
  schedule:
    # Avoid the top of the hour because GitHub documents higher Actions load there.
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  token-health:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate Meta credential and linked Instagram account
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
        run: |
          set -euo pipefail
          token="${META_SYSTEM_USER_TOKEN:-${IG_ACCESS_TOKEN:-${INSTAGRAM_ACCESS_TOKEN:-}}}"
          if [ -z "${token}" ]; then
            echo "ERROR: No Meta System User credential configured."
            exit 1
          fi
          response="$(curl -sS --get "https://graph.facebook.com/${META_GRAPH_API_VERSION}/me/accounts" --data-urlencode "fields=id,name,tasks,instagram_business_account{id,username}" --data-urlencode "access_token=${token}")"
          if echo "${response}" | grep -q '"error"'; then echo "${response}"; exit 1; fi
          linked="$(python -c 'import json,sys; d=json.load(sys.stdin); rows=[x for x in d.get("data",[]) if (x.get("instagram_business_account") or {}).get("id")]; rows.sort(key=lambda x: 0 if str(x.get("name","")).strip().lower()=="bullseye theory" else 1); print((rows[0].get("instagram_business_account") or {}).get("id","") if rows else "")' <<<"${response}")"
          if [ -z "${linked}" ]; then
            echo "ERROR: System User has no assigned Page with a linked Instagram account."
            exit 1
          fi
          configured="${IG_USER_ID:-${INSTAGRAM_USER_ID:-}}"
          if [ -z "${configured}" ]; then
            echo "ERROR: Instagram account ID secret is missing (IG_USER_ID / INSTAGRAM_USER_ID)."
            exit 1
          fi
          if [ "${configured}" != "${linked}" ]; then
            echo "ERROR: Configured Instagram account ID does not match the account linked to the Bullseye Theory Page."
            echo "Update the account-ID secret to the linked Instagram Business/Creator account ID; values are intentionally not printed."
            exit 1
          fi
          account_response="$(curl -sS --get "https://graph.facebook.com/${META_GRAPH_API_VERSION}/${configured}" --data-urlencode "fields=id,username,account_type" --data-urlencode "access_token=${token}")"
          if echo "${account_response}" | grep -q '"error"'; then
            echo "ERROR: The configured Instagram account object cannot be loaded with the publishing token. Meta returned an account-access error; values and token are redacted."
            exit 1
          fi
          echo "PASS: configured account ID matches the Bullseye Theory Page link and is readable by the publishing token."

      - name: Alert Telegram on invalid token or broken Instagram link
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          message="⚠️ Bullseye Theory automation: Meta/Instagram access check failed. Open the failed Token Health Check run for the exact error."
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=@bullseye_theory" --data-urlencode "text=${message}"
