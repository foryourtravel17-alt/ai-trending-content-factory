name: Instagram Token Health Check

on:
  push:
    paths:
      - '.github/workflows/instagram_token_health.yml'
      - 'agents/publisher.py'
      - 'tests/test_workflow_safety.py'
  workflow_dispatch:
  schedule:
    # Avoid the top of the hour because GitHub documents higher Actions load.
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  token-health:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate Meta credential, required permissions, and linked Instagram account
        # Keep repository pushes mergeable when the live Meta account needs owner-side repair.
        # Scheduled and manual runs still perform the real credential/scope check.
        if: github.event_name != 'push'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
        run: |
          set -euo pipefail
          linked=""
          page_token=""
          token_source=""
          candidate=""
          # Match agents/publisher.py: validate the exact credential the publisher will use.
          # Do not pass by falling back to a different token when the primary credential fails.
          for source in META_SYSTEM_USER_TOKEN INSTAGRAM_ACCESS_TOKEN IG_ACCESS_TOKEN; do
            configured_candidate="${!source:-}"
            if [ -n "${configured_candidate}" ]; then
              candidate="${configured_candidate}"
              token_source="${source}"
              break
            fi
          done
          if [ -z "${candidate}" ]; then
            echo "ERROR: No Instagram publishing credential is configured in publisher priority order. Credential values redacted."
            exit 1
          fi
          response="$(curl -sS --get "https://graph.facebook.com/${META_GRAPH_API_VERSION}/me/accounts" --data-urlencode "fields=id,name,tasks,access_token,instagram_business_account{id,username}" --data-urlencode "access_token=${candidate}")"
          if grep -q '"error"' <<<"${response}"; then
            echo "ERROR: Meta Page lookup failed for the selected publisher credential source ${token_source}; no fallback token will be tested. Credential values redacted."
            exit 1
          fi
          parsed="$(python -c 'import json,sys; d=json.load(sys.stdin); rows=[x for x in d.get("data",[]) if str(x.get("name","")).strip().casefold()=="bullseye theory" and (x.get("instagram_business_account") or {}).get("id") and x.get("access_token")]; print(str((rows[0].get("instagram_business_account") or {}).get("id",""))+"\t"+str(rows[0].get("access_token","")) if len(rows)==1 else "")' <<<"${response}")"
          if [ -z "${parsed}" ]; then
            echo "ERROR: The selected publisher credential did not resolve exactly one Bullseye Theory Page with a linked Instagram account and Page access token. Credential values redacted."
            exit 1
          fi
          IFS=$'\t' read -r linked page_token <<<"${parsed}"
          echo "INFO: Page link resolved using the same credential source as the publisher (${token_source}); credential values redacted."

          # A readable linked Page is not enough: verify the scopes used by publishing.
          permissions_response="$(curl -sS --get "https://graph.facebook.com/${META_GRAPH_API_VERSION}/me/permissions" --data-urlencode "access_token=${candidate}")"
          if grep -q '"error"' <<<"${permissions_response}"; then
            echo "ERROR: Meta permission-scope lookup failed; publishing readiness cannot be confirmed. Response and credentials redacted."
            exit 1
          fi
          missing_scopes="$(python -c 'import json,sys; d=json.load(sys.stdin); rows=d.get("data",[]); required={"pages_show_list","pages_read_engagement","instagram_basic","instagram_content_publish"}; granted={str(x.get("permission","")) for x in rows if str(x.get("status","")).lower()=="granted"}; print(",".join(sorted(required-granted)) if rows else "SCOPE_LOOKUP_EMPTY")' <<<"${permissions_response}")"
          if [ -z "${missing_scopes}" ]; then
            echo "PASS: all required Meta publishing permissions are granted."
          else
            echo "ERROR: required Meta publishing permissions are missing or could not be verified: ${missing_scopes}. Grant them in Meta app/System User settings, then refresh the GitHub credential. No credential values are printed."
            exit 1
          fi

          configured="${IG_USER_ID:-${INSTAGRAM_USER_ID:-}}"
          if [ -z "${configured}" ]; then
            echo "INFO: Legacy Instagram account-ID secret is unset; publisher resolves the account from the linked Bullseye Theory Page."
          elif [ "${configured}" != "${linked}" ]; then
            echo "WARNING: Legacy Instagram account-ID secret is stale; publisher will use the account resolved from the exact Bullseye Theory Page. No secret values are printed."
          fi
          account_response="$(curl -sS --get "https://graph.facebook.com/${META_GRAPH_API_VERSION}/${linked}" --data-urlencode "fields=id,username" --data-urlencode "access_token=${page_token}")"
          if grep -q '"error"' <<<"${account_response}"; then
            echo "ERROR: The Page-linked Instagram account cannot be loaded with its Page access token. Meta response redacted."
            exit 1
          fi
          echo "PASS: required permissions and the Instagram account linked to the Bullseye Theory Page are readable."

      - name: Alert Telegram on invalid token, missing scopes, or broken Instagram link
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          message="⚠️ Bullseye Theory automation: Meta/Instagram access or publishing-scope check failed. Open the failed Token Health Check run for the exact blocker."
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=@bullseye_theory" --data-urlencode "text=${message}"
