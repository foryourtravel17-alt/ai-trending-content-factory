name: Telegram Approval (manual info only)

# This workflow intentionally does not poll Telegram. The bot has one global
# getUpdates offset, so polling here could consume callbacks before the
# authoritative market_approval_poll.yml workflow processes them.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the single-poller setup
        run: |
          echo "No Telegram updates were polled by this workflow."
          echo "The single authoritative poller is .github/workflows/market_approval_poll.yml."
          echo "Educational Reel callbacks use the shared data/state.json market approval state."
