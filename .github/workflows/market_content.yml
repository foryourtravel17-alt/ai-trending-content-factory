name: Autonomous Market Content Factory

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate charts and captions without publishing"
        type: boolean
        required: false
        default: true
  schedule:
    - cron: "45 3 * * 1-5"  # 09:15 IST pre-market/open check
    - cron: "45 5 * * 1-5"  # 11:15 IST intraday
    - cron: "0 8 * * 1-5"   # 13:30 IST intraday
    - cron: "15 10 * * 1-5" # 15:45 IST end-of-day check

permissions:
  contents: write

concurrency:
  group: market-state
  cancel-in-progress: false

jobs:
  generate-approval-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DRY_RUN: ${{ inputs.dry_run || '0' }}
      HUMAN_APPROVAL: "false"
      # Generate and persist card PNGs first; Instagram requires a publicly reachable URL.
      GENERATE_ONLY: "true"
      LLM_ENABLED: ${{ vars.LLM_ENABLED || 'true' }}
      LLM_BASE: ${{ vars.LLM_BASE || secrets.LLM_BASE || 'https://api.venice.ai/api/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL || 'llama-3.3-70b' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_APPROVER_USER_IDS: ${{ secrets.TELEGRAM_APPROVER_USER_IDS }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
      GH_USER: ${{ vars.GH_USER || secrets.GH_USER }}
      GH_REPO: ${{ vars.GH_REPO || secrets.GH_REPO }}
      IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
      LOG_LEVEL: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate market data, charts, copy, and QA without publishing
        run: python -m src.orchestrator

      - name: Export sanitized approved Market Lab feed
        run: python scripts/export_public_market_feed.py

      - name: Commit generated approval drafts and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/approved_market_feed.json
          find output -maxdepth 1 -type f -name "*.png" -print0 | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "No generated image/state changes to commit."
          else
            git commit -m "market: generate educational approval drafts"
            git pull --rebase origin main
            git push
          fi

      - name: Wait for GitHub Pages images to become publicly reachable
        env:
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_BASE_URL:-}" ]; then
            echo "IMAGE_BASE_URL is not configured; refusing to publish Instagram media with an unknown public URL."
            exit 1
          fi
          shopt -s nullglob
          images=(output/*.png)
          if [ ${#images[@]} -eq 0 ]; then
            echo "No PNG images generated; nothing to wait for."
            exit 0
          fi
          deadline=$((SECONDS + 240))
          while (( SECONDS < deadline )); do
            pending=0
            for image in "${images[@]}"; do
              name="${image##*/}"
              code=$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 12 "${IMAGE_BASE_URL%/}/${name}" || true)
              if [ "$code" != "200" ]; then
                echo "Waiting for public image: $name (HTTP ${code:-unknown})"
                pending=1
              fi
            done
            if [ "$pending" -eq 0 ]; then
              echo "All ${#images[@]} generated image(s) return HTTP 200 from the configured public image base."
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for GitHub Pages images. Skipping publishing rather than sending broken media URLs."
          exit 1

      - name: Publish prepared market signals after generated images are public
        id: publish
        env:
          PUBLISH_ONLY: "true"
          # Scheduled runs publish; manual dispatch keeps its dry_run=true default.
          DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: python -m src.orchestrator

      - name: Refresh sanitized public feed with publishing outcomes
        if: always() && steps.publish.outcome != 'skipped'
        run: python scripts/export_public_market_feed.py

      - name: Commit publishing outcomes
        if: always() && steps.publish.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/approved_market_feed.json
          if git diff --cached --quiet; then
            echo "No publishing outcome changes to commit."
          else
            git commit -m "market: record publishing outcomes"
            git pull --rebase origin main
            git push
          fi
