name: Bullseye Organic-to-Paid Preflight

on:
  schedule:
    - cron: "30 4 * * 1" # Mondays at 10:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ads-preflight-report
  cancel-in-progress: false

jobs:
  read-only-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install minimal report dependency
        run: python -m pip install requests

      - name: Send private organic-to-paid review to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
        run: python scripts/ads_preflight_report.py
