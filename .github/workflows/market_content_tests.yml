name: Market Factory Tests

on:
  push:
    paths:
      - "agents/**"
      - "src/orchestrator.py"
      - "src/reel_generator.py"
      - "src/main.py"
      - "src/telegram_process.py"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "agents/**"
      - "src/orchestrator.py"
      - "src/reel_generator.py"
      - "src/main.py"
      - "src/telegram_process.py"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/market_content_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-factory-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Import-check agents and orchestration modules
        run: |
          python -c "import agents.scout, agents.charts, agents.card, agents.analyst, agents.copy, agents.qa, agents.publisher, src.orchestrator"
          python -m py_compile agents/*.py src/*.py scripts/*.py
      - name: Validate workflow YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = sorted(Path(".github/workflows").glob("*.yml"))
          for path in files:
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"YAML OK: {path}")
          PY
      - name: Run QA unit tests
        run: python -m unittest discover -s tests -v
      - name: Render review-only archetype samples
        run: python scripts/render_archetype_samples.py
      - name: Upload archetype sample PNGs
        uses: actions/upload-artifact@v4
        with:
          name: bullseye-archetype-samples
          path: output/archetype_samples/*.png
          if-no-files-found: error
      - name: Run synthetic DRY_RUN smoke test
        env:
          DRY_RUN: "1"
        run: python -m unittest discover -s tests -p 'test_dry_run.py' -v
