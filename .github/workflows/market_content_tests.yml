name: Market Factory Tests

on:
  push:
    paths:
      - "agents/**"
      - "src/orchestrator.py"
      - "src/telegram_process.py"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/market_content_tests.yml"
  pull_request:
    paths:
      - "agents/**"
      - "src/orchestrator.py"
      - "src/telegram_process.py"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/market_content_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Import-check agents and orchestration modules
        run: |
          python -c "import agents.scout, agents.charts, agents.card, agents.analyst, agents.copy, agents.qa, agents.publisher, src.orchestrator"
          python -m py_compile agents/*.py src/orchestrator.py src/telegram_process.py scripts/weekly_report.py scripts/refresh_ig_token.py
      - name: Run QA unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic DRY_RUN smoke test
        env:
          DRY_RUN: "1"
        run: python -m unittest tests.test_dry_run -v
