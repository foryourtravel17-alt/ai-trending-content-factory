name: Bullseye Hardening Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/bullseye-hardening]

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src agents config tests
      - name: Run deterministic tests (no live posts)
        env:
          HUMAN_APPROVAL: "true"
          DRY_RUN: "1"
        run: python -m unittest discover -s tests -v
