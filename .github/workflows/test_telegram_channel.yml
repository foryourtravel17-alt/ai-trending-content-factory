name: Test Telegram Channel Post

# Approval stance: the fixed test Reel is sent to the public channel only after explicit owner confirmation.
on:
  workflow_dispatch:
    inputs:
      confirm_test_post:
        description: "Explicitly authorize sending the fixed test Reel to the public Telegram channel"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  test:
    if: ${{ inputs.confirm_test_post == true }}
    runs-on: ubuntu-24.04
    steps:
      - name: Send fixed test Reel after explicit confirmation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VIDEO_URL: "https://kjhdcpjztuzpysdauqdz.supabase.co/storage/v1/object/public/REELS/reels/content_2.mp4"
          CAPTION: |
            🎯 Bullseye Theory — Trading Education

            News volatility can change the trading environment.

            Learn | Trade | Earn

            Educational content only. This is not financial advice.
        run: |
          RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            --data-urlencode "chat_id=@bullseye_theory" \
            --data-urlencode "video=${VIDEO_URL}" \
            --data-urlencode "caption=${CAPTION}")

          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'
