name: Telegram Approval Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-approval-recovery.yml"

permissions:
  contents: read

concurrency:
  group: bullseye-telegram-approval-sender
  cancel-in-progress: false

jobs:
  send-pending-approvals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Send only pending educational Reel approval requests
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/telegram_send.py
      - name: Persist Telegram delivery receipts even if a later send fails
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/stage_publish_state.sh
          if git diff --cached --quiet; then
            echo "No Telegram delivery-state changes to commit."
          else
            git commit -m "chore: persist Telegram approval delivery receipts"
            git pull --rebase --autostash origin main
            git push
          fi
