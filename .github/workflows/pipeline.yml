name: AI Trading Content Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST
    - cron: "30 7 * * *"   # 13:00 IST
    - cron: "30 13 * * *"  # 19:00 IST

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run content pipeline
        env:
          MOCK_MODE: "true"
          # Auto-process only content that has already passed the approval gate.
          AUTO_PUBLISH_ENABLED: "true"
          HUMAN_APPROVAL: ${{ vars.HUMAN_APPROVAL || 'true' }}
          CONTENT_BATCH_SIZE: "1"
          # Optional free-first LLM layer; remains disabled unless explicitly enabled.
          LLM_ENABLED: ${{ vars.LLM_ENABLED || 'false' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python src/main.py

      - name: Send pending content to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/telegram_send.py

      - name: Save generated content and Telegram state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore: update generated content and Telegram state"
            git push
          fi
