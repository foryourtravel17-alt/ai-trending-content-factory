name: AI Trading Content Pipeline (Automatic Publish)

on:
  # Manual fallback only. The dedicated daily Reel workflow owns the
  # three scheduled publishing slots to avoid duplicate-content runs.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run content pipeline
        env:
          MOCK_MODE: "false"
          AUTO_PUBLISH_ENABLED: "true"
          CONTENT_BATCH_SIZE: "1"
          # Optional free-first LLM layer; remains disabled unless explicitly enabled.
          LLM_ENABLED: ${{ vars.LLM_ENABLED || 'false' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python src/main.py

      - name: Save generated content and Telegram state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore: update generated content and Telegram state"
            git push
          fi
