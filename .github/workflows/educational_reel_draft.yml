name: Generate Educational Reel Draft (No Publish)

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Draft slot to generate; auto chooses based on current UTC time'
        type: choice
        required: true
        default: auto
        options:
          - auto
          - morning
          - afternoon
          - evening
  schedule:
    # Three draft-only slots in India time: 10:17 AM, 2:17 PM, 6:17 PM.
    - cron: '47 4 * * *'
    - cron: '47 8 * * *'
    - cron: '47 12 * * *'

permissions:
  contents: write

concurrency:
  group: market-state
  cancel-in-progress: false

jobs:
  generate-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TELEGRAM_APPROVER_USER_IDS: ${{ secrets.TELEGRAM_APPROVER_USER_IDS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create fresh rotating educational script
        id: draft
        env:
          CONTENT_SLOT: ${{ inputs.slot || 'auto' }}
        run: python scripts/daily_reel_draft.py

      - name: Install free rendering tools
        if: steps.draft.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip pillow edge-tts

      - name: Render MP4 draft locally in runner
        if: steps.draft.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.reel_generator import build
          content = json.loads(Path("output/draft_seed.json").read_text(encoding="utf-8"))
          build(content)
          Path("output/draft_seed.json").unlink(missing_ok=True)
          PY

      - name: Validate generated MP4
        if: steps.draft.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("output").glob("draft_*.json"), key=lambda p: p.stat().st_mtime, reverse=True)
          files = [p for p in files if p.name != "draft_seed.json"]
          if not files:
              raise SystemExit("No rendered draft metadata JSON found.")
          record = json.loads(files[0].read_text(encoding="utf-8"))
          content_id = str(record.get("content_id", "")).strip()
          if not content_id or files[0].stem != content_id:
              raise SystemExit("Draft metadata filename/content_id mismatch.")
          video = Path("output/media") / f"{content_id}.mp4"
          if not video.is_file() or video.stat().st_size == 0:
              raise SystemExit(f"Matching MP4 missing or empty for {content_id}.")
          print(f"Validated exact draft MP4: {video}")
          PY
          FILE="$(find output/media -maxdepth 1 -type f -name 'draft_*.mp4' -print -quit)"
          test -n "$FILE"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$FILE"

      - name: Upload and verify exact MP4 in Supabase
        if: steps.draft.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/upload_educational_reel.py

      - name: Register draft in shared approval state
        if: steps.draft.outputs.skip != 'true'
        run: python scripts/queue_educational_draft.py

      - name: Send Telegram approval request
        if: steps.draft.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/telegram_send.py

      - name: Persist shared approval state (draft only)
        if: steps.draft.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/stage_publish_state.sh
          if git diff --cached --quiet; then
            echo "No draft state changes to commit."
          else
            git commit -m "content: queue educational Reel for human review"
            git pull --rebase origin main
            git push
          fi

      - name: Upload draft for review (no publishing)
        if: steps.draft.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bullseye-educational-reel-draft
          path: |
            output/media/draft_*.mp4
            output/media/draft_*.publish.json
            output/draft_*.json
          if-no-files-found: error
          retention-days: 7

      - name: No-op when this slot already has a draft
        if: steps.draft.outputs.skip == 'true'
        run: echo "This UTC date/slot already has a persisted draft. Skipped render, upload, Telegram approval, and all publishing."
