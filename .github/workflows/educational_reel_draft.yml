name: Generate Educational Reel Draft (No Publish)

on:
  workflow_dispatch:
  schedule:
    # 10:15 AM India time (04:45 UTC) daily; creates drafts only.
    - cron: '45 4 * * *'

permissions:
  contents: read

concurrency:
  group: educational-reel-draft
  cancel-in-progress: false

jobs:
  generate-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip pillow edge-tts

      - name: Create fresh rotating educational script
        run: python scripts/daily_reel_draft.py

      - name: Render MP4 draft locally in runner
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.reel_generator import build
          content = json.loads(Path("output/draft_seed.json").read_text(encoding="utf-8"))
          build(content)
          Path("output/draft_seed.json").unlink(missing_ok=True)
          PY

      - name: Validate generated MP4
        run: |
          set -e
          FILE="$(find output/media -maxdepth 1 -type f -name 'draft_*.mp4' -print -quit)"
          test -n "$FILE"
          test -s "$FILE"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$FILE"
          echo "Draft rendered successfully: $FILE"

      - name: Upload draft for review (no publishing)
        uses: actions/upload-artifact@v4
        with:
          name: bullseye-educational-reel-draft
          path: |
            output/media/draft_*.mp4
            output/media/draft_*.publish.json
            output/content_draft_*.json
          if-no-files-found: error
          retention-days: 7
