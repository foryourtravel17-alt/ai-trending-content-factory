name: Bullseye Levels — Node.js tests

on:
  push:
    branches: [feat/bullseye-levels-engine]
    paths:
      - 'RULES.md'
      - 'lib/levels.mjs'
      - 'tests/levels.test.mjs'
      - 'server.mjs'
      - 'package.json'
      - '.github/workflows/bullseye-levels-test.yml'
  pull_request:
    paths:
      - 'RULES.md'
      - 'lib/levels.mjs'
      - 'tests/levels.test.mjs'
      - 'server.mjs'
      - 'package.json'
      - '.github/workflows/bullseye-levels-test.yml'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check server.mjs
      - run: npm test
